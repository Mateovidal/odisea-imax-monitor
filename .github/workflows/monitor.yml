name: monitor-funciones

on:
  schedule:
    - cron: "*/10 * * * *"   # cada 10 min (GitHub puede demorarlo unos minutos)
  workflow_dispatch:

permissions:
  contents: write
  actions: write   # para el keepalive (re-habilitar el workflow por API)

concurrency:
  group: monitor
  cancel-in-progress: false

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      # El monitor usa el endpoint JSON de Voy al Cine y solo la stdlib:
      # no hay pip install ni navegador. Corre en ~1s.
      - name: Run monitor
        id: run
        continue-on-error: true          # exit 1 = falla real, pero igual quiero persistir state
        env:
          # Solo Telegram (email/dead-man desactivados a pedido del usuario).
          TG_TOKEN: ${{ secrets.TG_TOKEN }}
          TG_CHAT_ID: ${{ secrets.TG_CHAT_ID }}
          FILMS: "6027"          # Oasis: Don't Look Back in Anger (La Odisea salió de cartel)
          WATCH_NAMES: "avengers,dune"  # descubre estas pelis cuando aparezcan en el catálogo
          WATCH_EXCLUDE: "endgame,bonus"  # ignora re-funciones de Endgame
          HOUSE_ID: "3250"
          VENUE_IS_IMAX: "1"
          # 0 = la fecha nueva del borde SÍ avisa (Showcase libera fecha por fecha).
          SUPPRESS_HORIZON_ROLL: "0"
        run: python monitor.py

      # Siempre persistimos state.json, incluso si el monitor falló: ahí vive el
      # flag "falla_avisada" que evita re-avisar la misma falla cada 10 min.
      - name: Persist state
        if: always()
        run: |
          git config user.name "monitor-bot"
          git config user.email "bot@users.noreply.github.com"
          if [ -f state.json ]; then
            git add state.json
            if ! git diff --staged --quiet; then
              git commit -m "state $(date -u +%FT%TZ)"
              git pull --rebase --autostash || true
              git push
            fi
          fi

      # GitHub desactiva los workflows programados tras 60 días sin actividad en el
      # repo. El bot solo commitea cuando algo cambia, así que en épocas quietas podría
      # caer. Si el último commit tiene más de 20 días, dejo un commit de keepalive, y
      # además re-habilito el workflow por API (idempotente).
      - name: Keepalive
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          last=$(git log -1 --format=%ct)
          if [ $(( $(date +%s) - last )) -gt $(( 20 * 86400 )) ]; then
            date -u +%FT%TZ > .keepalive
            git add .keepalive
            git commit -q -m "keepalive $(date -u +%F)"
            git pull --rebase --autostash -q || true
            git push -q || true
          fi
          gh api -X PUT "repos/${{ github.repository }}/actions/workflows/monitor.yml/enable" || true

      # Reflejamos en rojo si el monitor salió con error (después de persistir).
      - name: Fail if monitor failed
        if: ${{ always() && steps.run.outcome == 'failure' }}
        run: |
          echo "monitor.py salió con código de error — revisá el paso 'Run monitor'."
          exit 1
